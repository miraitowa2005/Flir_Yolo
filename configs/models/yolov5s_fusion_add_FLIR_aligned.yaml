# parameters
# yolov5s 双流 Add融合 FLIR-aligned
# 和 yolov5l 版本的唯一区别：
#   depth_multiple: 0.33  （l是1.00，s更浅）
#   width_multiple: 0.50  （l是1.00，s更窄）
# 结构、层编号、融合方式完全相同

nc: 3  # number of classes: car, person, bicycle
depth_multiple: 0.33  # 模型深度系数（s版本）
width_multiple: 0.50  # 模型宽度系数（s版本）

# anchors
anchors:
  - [10,13, 16,30, 33,23]   # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  # Two Stream
  [
   # ---- stream one (RGB) ----
   [-1, 1, Focus, [64, 3]],        # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4
   [-1, 3, C3, [128]],             # 2
   [-1, 1, Conv, [256, 3, 2]],     # 3-P3/8
   [-1, 9, C3, [256]],             # 4-P3/8  ← P3特征

   [-1, 1, Conv, [512, 3, 2]],     # 5-P4/16
   [-1, 9, C3, [512]],             # 6-P4/16  ← P4特征

   [-1, 1, Conv, [1024, 3, 2]],    # 7-P5/32
   [-1, 1, SPP, [1024, [5,9,13]]], # 8-P5/32
   [-1, 3, C3, [1024, False]],     # 9-P5/32  ← P5特征

   # ---- stream two (IR) ----
   [-4, 1, Focus, [64, 3]],        # 10-P1/2  （-4表示从第6层往前数4层，即从stream one的第6层之前分叉）
   [-1, 1, Conv, [128, 3, 2]],     # 11-P2/4
   [-1, 3, C3, [128]],             # 12
   [-1, 1, Conv, [256, 3, 2]],     # 13-P3/8
   [-1, 9, C3, [256]],             # 14-P3/8  ← IR P3特征

   [-1, 1, Conv, [512, 3, 2]],     # 15-P4/16
   [-1, 9, C3, [512]],             # 16-P4/16  ← IR P4特征

   [-1, 1, Conv, [1024, 3, 2]],    # 17-P5/32
   [-1, 1, SPP, [1024, [5,9,13]]], # 18-P5/32
   [-1, 3, C3, [1024, False]],     # 19-P5/32  ← IR P5特征

   # ---- Add融合（RGB + IR 对应层相加）----
   [[4,14],  1, Add, [1]],         # 20  P3融合
   [[6,16],  1, Add, [1]],         # 21  P4融合
   [[9,19],  1, Add, [1]],         # 22  P5融合
  ]


# YOLOv5 head（PANet + 检测头，和单流YOLOv5完全一样）
head:
  [
   [-1,    1, Conv,        [512, 1, 1]],           # 23
   [-1,    1, nn.Upsample, [None, 2, 'nearest']],  # 24
   [[-1,21],1, Concat,     [1]],                   # 25  cat P4
   [-1,    3, C3,          [512, False]],           # 26

   [-1,    1, Conv,        [256, 1, 1]],            # 27
   [-1,    1, nn.Upsample, [None, 2, 'nearest']],   # 28
   [[-1,20],1, Concat,     [1]],                    # 29  cat P3
   [-1,    3, C3,          [256, False]],            # 30  (P3/8-small)

   [-1,    1, Conv,        [256, 3, 2]],             # 31
   [[-1,27],1, Concat,     [1]],                     # 32  cat head P4
   [-1,    3, C3,          [512, False]],             # 33  (P4/16-medium)

   [-1,    1, Conv,        [512, 3, 2]],              # 34
   [[-1,23],1, Concat,     [1]],                      # 35  cat head P5
   [-1,    3, C3,          [1024, False]],             # 36  (P5/32-large)

   [[30,33,36], 1, Detect, [nc, anchors]],            # Detect(P3, P4, P5)
  ]
